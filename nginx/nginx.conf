user nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';

    # access_log  /var/log/nginx/access.log  main;

    sendfile on;
    #tcp_nopush on;

    keepalive_timeout 65;

    #gzip on;

#     upstream backend {
#         server backend:8080; # backend 도커컴포즈에 서비스명 http://10.10.1.1:8080/products
#     }
    map $uri $javascript_module_mime {
        ~*\.js$ "application/javascript";
        default "";
    }

    server {
        listen 80;
        server_name localhost;

        # 모든 JavaScript 파일에 대한 명시적인 Content-Type 설정
        location ~ \.js$ {
            add_header Content-Type application/javascript always;
            add_header X-Content-Type-Options nosniff;
            root /usr/share/nginx/html;
            try_files $uri =404;
        }
        
        # 다른 정적 파일에 대한 처리
        location ~* \.(css|png|jpg|jpeg|gif|ico)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

#             proxy_redirect     off;
#             proxy_set_header   Host $host;
#             proxy_set_header   X-Real-IP $remote_addr;
#             proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header   X-Forwarded-Host $server_name;
#
#             proxy_set_header X-NginX-Proxy true;
        }

        # 상태 확인 엔드포인트
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

#         location /api/ {
#             proxy_pass http://backend;
#             rewrite ^/api(/.*)$ $1 break; # /api/ 제거가 된다!!
#             proxy_http_version 1.1;
#             proxy_set_header Upgrade $http_upgrade;
#             proxy_set_header Connection 'upgrade';
#
#             proxy_redirect     off;
#             proxy_set_header   Host $host;
#             proxy_set_header   X-Real-IP $remote_addr;
#             proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header   X-Forwarded-Host $server_name;
#
#          }
    }

    include /etc/nginx/conf.d/*.conf;

    # MIME 타입 설정은 한 번만 정의합니다
    types {
        application/javascript js mjs;
    }

    map $sent_http_content_type $cors_header {
        "application/javascript" "*";
        default "";
    }
}